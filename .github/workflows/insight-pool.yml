name: Insight Pool

on:
  schedule:
    # Beijing weekdays: all DeepSeek work runs overnight and finishes before 09:00.
    # Early-morning UTC schedules use Sunday-Thursday because Beijing is on the next day.
    - cron: "10 16 * * 0-4" # 00:10 Beijing: full collection
    - cron: "30 19 * * 0-4" # 03:30 Beijing: deficit check
    - cron: "30 22 * * 0-4" # 06:30 Beijing: final top-up
  workflow_dispatch:
    inputs:
      score_limit:
        description: "Maximum products to score this run"
        required: true
        default: "60"
      agent_queries:
        description: "DeepSeek-planned searches per round"
        required: true
        default: "90"
      agent_pages:
        description: "Fresh pages screened per round"
        required: true
        default: "420"
      use_tavily:
        description: "Use Tavily credits for this manual deep run"
        required: true
        default: "false"
      refresh_only:
        description: "Only fill/refresh today's displayable picks"
        required: true
        default: "false"
      backlog_only:
        description: "Promote reviewed reserve candidates without DeepSeek"
        required: true
        default: "false"

permissions:
  contents: write

concurrency:
  group: insight-pool-main
  cancel-in-progress: false

jobs:
  build-insight-pool:
    runs-on: ubuntu-latest
    env:
      DEEPSEEK_ALLOWED_WINDOWS: "00:00-08:40"
      DEEPSEEK_WINDOW_END_BUFFER_MINUTES: "1"
      DEEPSEEK_USAGE_FILE: "data/reports/deepseek-usage.json"
      DEEPSEEK_DAILY_MAX_CALLS: "180"
      DEEPSEEK_DAILY_MAX_TOKENS: "1350000"
      DEEPSEEK_ALLOW_OUTSIDE_WINDOW: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check DeepSeek off-peak window
        run: python3 scripts/deepseek_policy.py --export-github-env

      - name: Set collection mode and daily target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "DAILY_TARGET=40" >> "$GITHUB_ENV"
              echo "SOCIAL_TARGET=0" >> "$GITHUB_ENV"
              if [ "${{ github.event.inputs.backlog_only || 'false' }}" = "true" ]; then
                echo "RUN_MODE=backlog" >> "$GITHUB_ENV"
              elif [ "${{ github.event.inputs.refresh_only || 'false' }}" = "true" ]; then
                echo "RUN_MODE=check" >> "$GITHUB_ENV"
              else
                echo "RUN_MODE=main" >> "$GITHUB_ENV"
              fi
              echo "SCORE_LIMIT=${{ github.event.inputs.score_limit || '60' }}" >> "$GITHUB_ENV"
              echo "AGENT_QUERIES=${{ github.event.inputs.agent_queries || '90' }}" >> "$GITHUB_ENV"
              echo "AGENT_PAGES=${{ github.event.inputs.agent_pages || '420' }}" >> "$GITHUB_ENV"
              echo "TOPUP_AGENT_QUERIES=${{ github.event.inputs.agent_queries || '90' }}" >> "$GITHUB_ENV"
              echo "TOPUP_AGENT_PAGES=${{ github.event.inputs.agent_pages || '420' }}" >> "$GITHUB_ENV"
              echo "TOPUP_MAX_PASSES=1" >> "$GITHUB_ENV"
              if [ "${{ github.event.inputs.backlog_only || 'false' }}" = "true" ]; then
                echo "DEEPSEEK_MAX_CALLS=1" >> "$GITHUB_ENV"
              else
                echo "DEEPSEEK_MAX_CALLS=80" >> "$GITHUB_ENV"
              fi
              if [ "${{ github.event.inputs.use_tavily || 'false' }}" = "true" ]; then
                echo "USE_TAVILY_SEARCH=1" >> "$GITHUB_ENV"
              else
                echo "USE_TAVILY_SEARCH=0" >> "$GITHUB_ENV"
              fi
          else
              bj_hm="$(TZ=Asia/Shanghai date +%H%M)"
              echo "DAILY_TARGET=40" >> "$GITHUB_ENV"
              if [ "${{ github.event.schedule }}" = "10 16 * * 0-4" ]; then
                echo "RUN_MODE=main" >> "$GITHUB_ENV"
                echo "SCORE_LIMIT=0" >> "$GITHUB_ENV"
                echo "AGENT_QUERIES=140" >> "$GITHUB_ENV"
                echo "AGENT_PAGES=650" >> "$GITHUB_ENV"
                echo "TOPUP_AGENT_QUERIES=70" >> "$GITHUB_ENV"
                echo "TOPUP_AGENT_PAGES=320" >> "$GITHUB_ENV"
                echo "TOPUP_MAX_PASSES=1" >> "$GITHUB_ENV"
                echo "DEEPSEEK_MAX_CALLS=120" >> "$GITHUB_ENV"
              else
                echo "RUN_MODE=check" >> "$GITHUB_ENV"
                echo "SCORE_LIMIT=0" >> "$GITHUB_ENV"
                echo "AGENT_QUERIES=0" >> "$GITHUB_ENV"
                echo "AGENT_PAGES=0" >> "$GITHUB_ENV"
                if [ "${{ github.event.schedule }}" = "30 19 * * 0-4" ]; then
                  echo "TOPUP_AGENT_QUERIES=60" >> "$GITHUB_ENV"
                  echo "TOPUP_AGENT_PAGES=300" >> "$GITHUB_ENV"
                  echo "TOPUP_MAX_PASSES=1" >> "$GITHUB_ENV"
                  echo "DEEPSEEK_MAX_CALLS=40" >> "$GITHUB_ENV"
                elif [ "${{ github.event.schedule }}" = "30 22 * * 0-4" ]; then
                  echo "TOPUP_AGENT_QUERIES=80" >> "$GITHUB_ENV"
                  echo "TOPUP_AGENT_PAGES=380" >> "$GITHUB_ENV"
                  echo "TOPUP_MAX_PASSES=1" >> "$GITHUB_ENV"
                  echo "DEEPSEEK_MAX_CALLS=40" >> "$GITHUB_ENV"
                else
                  echo "TOPUP_AGENT_QUERIES=60" >> "$GITHUB_ENV"
                  echo "TOPUP_AGENT_PAGES=280" >> "$GITHUB_ENV"
                  echo "TOPUP_MAX_PASSES=1" >> "$GITHUB_ENV"
                  echo "DEEPSEEK_MAX_CALLS=40" >> "$GITHUB_ENV"
                fi
              fi
              echo "SOCIAL_TARGET=0" >> "$GITHUB_ENV"
              echo "USE_TAVILY_SEARCH=0" >> "$GITHUB_ENV"
              echo "PHASE_CLOCK=$bj_hm" >> "$GITHUB_ENV"
          fi

      - name: Skip closed or completed phase
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          target = int(os.environ.get("DAILY_TARGET", "40"))
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          run_mode = os.environ.get("RUN_MODE", "main")
          today = dt.datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          skip = False
          reason = "manual_or_incomplete"

          if run_mode != "backlog" and os.environ.get("DEEPSEEK_WINDOW_OPEN") != "1":
              skip = True
              reason = "outside_configured_deepseek_window"

          elif event_name == "schedule":
              path = Path("insight/data.raw.json")
              if path.exists():
                  data = json.loads(path.read_text(encoding="utf-8"))
                  group = (data.get("daily_groups") or [{}])[0]
                  actual = int(group.get("actual_count") or len(group.get("items") or []))
                  if group.get("date") == today and actual >= target:
                      skip = True
                      reason = f"today_target_already_met date={today} actual={actual} target={target}"
                  else:
                      reason = f"needs_run date={group.get('date')} actual={actual} target={target} today={today}"
              else:
                  reason = "no_existing_dashboard_data"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"SKIP_INSIGHT={'1' if skip else '0'}\n")
          print(f"skip_insight={skip} reason={reason}")
          PY

      - name: Sync team feedback
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python3 scripts/sync_feedback.py

      - name: Build preference profile
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        run: python3 scripts/build_preference_profile.py

      - name: Collect public leads
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        run: python3 scripts/collect_public.py

      - name: Collect curated product pages
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        run: python3 scripts/collect_curated_pages.py --limit 90 --shopify-pages 1

      - name: Generate search job matrix
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        run: python3 scripts/search_jobs.py

      - name: Install free search backend
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE != 'backlog'
        run: python3 -m pip install -q ddgs

      - name: Run DeepSeek search agent
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        timeout-minutes: 90
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: >-
          python3 scripts/deepseek_search_agent.py
          --target "$DAILY_TARGET"
          --round 0
          --query-count "$AGENT_QUERIES"
          --per-query 10
          --max-pages "$AGENT_PAGES"
          --search-workers 6
          --page-workers 12
          --screen-workers 6
          --batch-size 12

      - name: Dedupe product pool
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        run: python3 scripts/dedupe.py

      - name: Review category fit
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          CATEGORY_REVIEW_WORKERS: "4"
        run: python3 scripts/review_categories.py --batch-size 8

      - name: Ensure phased public social picks
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python3 scripts/ensure_daily_social_minimum.py --target "$SOCIAL_TARGET" --batch-jobs 50 --per-job 4 --max-passes 1 --sleep 0.1 --workers 4

      - name: Ensure 40 daily accepted picks
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE != 'backlog'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
          SEARXNG_BASE_URL: ${{ secrets.SEARXNG_BASE_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          python3 scripts/ensure_daily_minimum.py \
            --target "$DAILY_TARGET" \
            --per-job 10 \
            --max-passes "$TOPUP_MAX_PASSES" \
            --workers 6 \
            --agent-queries "$TOPUP_AGENT_QUERIES" \
            --agent-pages "$TOPUP_AGENT_PAGES" \
            --agent-screen-workers 6 \
            --review-batch-size 8 \
            --curated-limit 90 \
            --shopify-pages 1

      - name: Promote reviewed backlog without DeepSeek
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'backlog'
        run: python3 scripts/promote_reviewed_backlog.py --target "$DAILY_TARGET"

      - name: Enrich missing product images
        if: env.SKIP_INSIGHT != '1'
        run: python3 scripts/enrich_images.py --limit 50

      - name: Generate trend report
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        timeout-minutes: 12
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: deepseek-v4-flash
        run: python3 scripts/trend_agent.py --limit 100

      - name: Report DeepSeek usage
        if: always()
        run: |
          python3 scripts/deepseek_policy.py --report
          echo "### DeepSeek usage" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/deepseek_policy.py --report >> "$GITHUB_STEP_SUMMARY"

      - name: Build static insight dashboard
        if: env.SKIP_INSIGHT != '1'
        run: python3 scripts/build_site.py

      - name: Generate weekly 100-pick report
        if: env.SKIP_INSIGHT != '1' && env.RUN_MODE == 'main'
        run: python3 scripts/weekly_report.py --limit 100

      - name: Rebuild dashboard with weekly report
        if: env.SKIP_INSIGHT != '1'
        run: python3 scripts/build_site.py

      - name: Commit data and dashboard
        if: env.SKIP_INSIGHT != '1'
        run: |
          git config user.name "design-insight-bot"
          git config user.email "bot@design-digest.com"
          git add index.html data/raw/ data/reports/ data/search_jobs.json data/products.json data/dedupe_index.json data/seen_fingerprints.json data/category_review.json data/rejected_category.json data/published.json data/trends.json data/weekly_report.json data/feedback_events.json data/preference_profile.json insight/
          if ! git diff --staged --quiet; then
            git commit -m "Update insight pool $(date +%Y-%m-%d)"
            git pull --rebase -X theirs origin main
            git push
          else
            echo "No insight pool changes"
          fi

      - name: Verify daily target
        if: env.SKIP_INSIGHT != '1'
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          target = int(os.environ.get("DAILY_TARGET", "40"))
          today = dt.datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          data = json.loads(Path("insight/data.raw.json").read_text(encoding="utf-8"))
          group = (data.get("daily_groups") or [{}])[0]
          actual = int(group.get("actual_count") or len(group.get("items") or []))
          report = f"daily_target date={group.get('date')} actual={actual} target={target}"
          print(report)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write(f"### Daily target verification\n\n{report}\n")
          if group.get("date") != today or actual < target:
              raise SystemExit(f"Daily target incomplete: {report}")
          PY
