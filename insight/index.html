<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Selection Signal Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Sans+SC:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f5f7fa;
      --panel: #ffffff;
      --soft: #f0f3f7;
      --ink: #1f2430;
      --muted: #687184;
      --line: #dfe4ec;
      --accent: #d66b2c;
      --green: #4f8063;
      --blue: #527fa3;
      --shadow: 0 16px 34px rgba(31, 41, 55, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, #fafbfc 0%, var(--bg) 100%);
      color: var(--ink);
    }
    .shell { width: min(1480px, calc(100vw - 32px)); margin: 0 auto; padding: 28px 0 48px; }
    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: end;
    }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0; }
    h1 { margin: 8px 0 8px; font-size: clamp(34px, 4.6vw, 58px); line-height: 1.02; letter-spacing: 0; }
    .lead { margin: 0; max-width: 760px; color: var(--muted); font-size: 16px; line-height: 1.65; }
    .generated { color: var(--muted); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .metrics {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      min-height: 90px;
      box-shadow: var(--shadow);
    }
    .metric strong { display: block; font-size: 30px; line-height: 1; }
    .metric span { display: block; margin-top: 9px; color: var(--muted); font-size: 13px; font-weight: 700; }
    .tabs {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      background: var(--soft);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px;
    }
    .tab {
      min-height: 48px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .tab.active { background: var(--panel); color: var(--ink); box-shadow: 0 4px 14px rgba(31,41,55,.08); }
    .toolbar {
      margin-top: 16px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: center;
    }
    .search {
      height: 48px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 14px;
    }
    .search input { width: 100%; border: 0; outline: 0; background: transparent; font: inherit; color: var(--ink); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; }
    .chip {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      padding: 0 12px;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .chip.active { background: var(--ink); border-color: var(--ink); color: #fff; }
    .content {
      margin-top: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 20px;
    }
    .section-head {
      display: block;
      margin-bottom: 16px;
    }
    .section-head h2 { margin: 0; font-size: 25px; line-height: 1.2; letter-spacing: 0; }
    .section-note { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
    .review-strip {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 14px 0;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--soft);
    }
    .review-counts { color: var(--muted); font-size: 13px; font-weight: 800; }
    .review-counts strong { color: var(--ink); }
    .feedback-switch { display: inline-flex; gap: 4px; padding: 3px; border-radius: 7px; background: #e7ebf1; }
    .feedback-filter {
      min-height: 30px;
      border: 0;
      border-radius: 5px;
      padding: 0 10px;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
    }
    .feedback-filter.active { background: var(--panel); color: var(--ink); box-shadow: 0 2px 8px rgba(31, 41, 55, .08); }
    .selector { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-start; align-items: center; margin-top: 14px; }
    .history-select {
      min-height: 38px;
      padding: 0 34px 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    .history-range { color: var(--muted); font-size: 13px; }
    .lane-switch { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(252px, 1fr)); gap: 14px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      min-height: 100%;
      display: flex;
      flex-direction: column;
    }
    .card.feedback-like { border-color: #84b698; box-shadow: inset 0 0 0 1px #84b698; }
    .card.feedback-pass { border-color: #d7a3a3; background: #fbf8f8; }
    .thumb {
      width: 100%;
      aspect-ratio: 1.18 / .82;
      object-fit: cover;
      background: linear-gradient(135deg, #e9eef5, #f8fafc);
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
      text-align: center;
    }
    .body { padding: 13px; display: grid; gap: 8px; flex: 1; }
    .meta, .tags { display: flex; flex-wrap: wrap; gap: 7px; }
    .pill {
      min-height: 24px;
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 0 8px;
      font-size: 11px;
      font-weight: 800;
      background: #fff4e8;
      color: #9c4b1c;
    }
    .pill.green { background: #edf5ee; color: var(--green); }
    .pill.blue { background: #edf5f8; color: var(--blue); }
    .pill.gray { background: #f2f4f7; color: #667085; }
    .card h3 { margin: 0; font-size: 18px; line-height: 1.28; letter-spacing: 0; }
    .card h3 a { color: inherit; text-decoration: none; }
    .card h3 a:hover { color: var(--accent); }
    .summary {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      min-height: 58px;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .feedback-actions {
      margin-top: auto;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 7px;
      align-items: center;
    }
    .feedback-action, .feedback-undo {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .feedback-action:hover { border-color: #9ca5b4; background: #f8fafc; }
    .feedback-action.like.active { border-color: #4f8063; background: #edf5ee; color: #356247; }
    .feedback-action.pass.active { border-color: #b86969; background: #faeeee; color: #8d4141; }
    .feedback-undo { width: 36px; padding: 0; color: var(--muted); }
    .feedback-status {
      grid-column: 1 / -1;
      min-height: 18px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }
    .feedback-status.like { color: #356247; }
    .feedback-status.pass { color: #8d4141; }
    .reason-dialog {
      width: min(460px, calc(100vw - 28px));
      border: 0;
      border-radius: 8px;
      padding: 0;
      color: var(--ink);
      box-shadow: 0 28px 70px rgba(31, 41, 55, .24);
    }
    .reason-dialog::backdrop { background: rgba(31, 36, 48, .42); }
    .reason-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
    .reason-head h3 { margin: 0; font-size: 18px; }
    .reason-options { display: grid; gap: 8px; padding: 14px 18px; }
    .reason-option {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 38px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }
    .reason-option:has(input:checked) { border-color: #b86969; background: #faeeee; }
    .reason-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 18px; }
    .dialog-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 14px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .dialog-button.primary { border-color: #a74e4e; background: #a74e4e; color: #fff; }
    .empty {
      min-height: 180px;
      display: grid;
      place-items: center;
      color: var(--muted);
      background: var(--soft);
      border-radius: 8px;
      font-weight: 800;
      text-align: center;
      padding: 24px;
    }
    @media (max-width: 900px) {
      .topbar, .toolbar { grid-template-columns: 1fr; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .tabs { grid-template-columns: 1fr; }
      .filters, .selector { justify-content: flex-start; }
    }
    @media (max-width: 620px) {
      .shell { width: min(100vw - 20px, 1480px); padding-top: 18px; }
      .metrics { grid-template-columns: 1fr; }
      .grid { grid-template-columns: 1fr; }
      .review-strip { align-items: flex-start; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">Selection Signal Desk</div>
        <h1>选品情报工作台</h1>
        <p class="lead">每日看新增，每周看推荐，通过池只保留品类相关且达到选品质量线的内容。让团队打开一个页面就知道今天系统真正筛出了什么。</p>
      </div>
      <div class="generated" id="generatedAt"></div>
    </header>

    <section class="metrics" id="metrics"></section>

    <nav class="tabs">
      <button class="tab active" type="button" data-tab="daily">今日新增</button>
      <button class="tab" type="button" data-tab="weekly">本周推荐</button>
      <button class="tab" type="button" data-tab="pool">审核通过池</button>
    </nav>

    <section class="toolbar">
      <label class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="搜索标题、品类、来源、启发类型">
      </label>
      <div class="filters" id="filters"></div>
    </section>

    <main class="content">
      <div class="section-head">
        <div>
          <h2 id="viewTitle"></h2>
          <p class="section-note" id="viewNote"></p>
        </div>
        <div class="selector" id="groupSelector"></div>
      </div>
      <div class="review-strip" id="reviewStrip"></div>
      <div class="lane-switch" id="laneSwitch"></div>
      <section class="grid" id="grid"></section>
      <div class="empty" id="emptyState" hidden>当前筛选下没有内容。</div>
    </main>
  </div>

  <dialog class="reason-dialog" id="reasonDialog">
    <form method="dialog" id="reasonForm">
      <div class="reason-head"><h3>Pass 原因</h3></div>
      <div class="reason-options" id="reasonOptions"></div>
      <div class="reason-actions">
        <button class="dialog-button" value="cancel" type="submit">取消</button>
        <button class="dialog-button primary" id="confirmPass" value="confirm" type="submit">确认 Pass</button>
      </div>
    </form>
  </dialog>

  <script src="./data.json"></script>
  <script src="./feedback-config.js"></script>
  <script src="./feedback-client.js"></script>
  <script>
    const payload = window.__INSIGHT_DATA__;
    const configuredCategories = payload.configured_categories || [
      "水杯", "氛围灯", "创意礼盒", "装置艺术", "创意厨具", "中秋礼盒", "创意桌搭", "端午礼盒", "充电宝",
      "日历", "手机壳", "冲锋衣", "钥匙扣水壶"
    ];
    const retiredCategories = new Set(payload.retired_categories || ["T恤", "帽子", "卫衣", "Polo衫", "收纳包", "卡包"]);
    const state = {
      tab: "daily",
      q: "",
      lane: "全部",
      category: "全部",
      source: "全部",
      feedback: "全部",
      dailyGroup: "",
      weeklyGroup: ""
    };
    const $ = id => document.getElementById(id);
    const passReasons = [
      ["too_ordinary", "太普通，没有明显创意增量"],
      ["weak_function", "功能价值弱或需求不高频"],
      ["wrong_category", "品类错误或与选品范围无关"],
      ["low_margin", "价格空间或利润不足"],
      ["hard_to_execute", "难以买样、改造或落地"],
      ["bad_evidence", "图片、链接或产品证据有问题"]
    ];
    let pendingPassItemId = "";

    function groupsDaily() {
      return (payload.daily_groups || []).filter(group => group.items && group.items.length);
    }

    function groupsWeekly() {
      const groups = payload.weekly_groups && payload.weekly_groups.length
        ? payload.weekly_groups
        : (payload.weekly_report && payload.weekly_report.recommendations ? [payload.weekly_report] : []);
      return groups.filter(group => group.recommendations && group.recommendations.length);
    }

    function activeDaily() {
      const groups = groupsDaily();
      if (!groups.length) return null;
      if (!state.dailyGroup) state.dailyGroup = groups[0].group_id || groups[0].date;
      return groups.find(group => (group.group_id || group.date) === state.dailyGroup) || groups[0];
    }

    function activeWeekly() {
      const groups = groupsWeekly();
      if (!groups.length) return null;
      if (!state.weeklyGroup) state.weeklyGroup = groups[0].group_id || groups[0].week;
      return groups.find(group => (group.group_id || group.week) === state.weeklyGroup) || groups[0];
    }

    function sourceText(item) {
      return item.source_name || item.source || "未知来源";
    }

    function feedbackProductId(item) {
      return String(item.id || item.url || item.title);
    }

    function scoreText(item) {
      if (item.score_label) return item.score_label;
      return ((item.score || 0) / 10).toFixed(1);
    }

    function textFor(item) {
      return [
        item.title, item.category, item.summary, sourceText(item),
        item.action_lane, item.source_family, ...(item.axes || []), ...(item.tags || [])
      ].join(" ").toLowerCase();
    }

    function matches(item) {
      if (state.lane !== "全部" && item.action_lane !== state.lane) return false;
      if (state.category !== "全部" && item.category !== state.category) return false;
      if (state.source !== "全部" && item.source_family !== state.source) return false;
      const feedback = FeedbackStore.decision(feedbackProductId(item));
      if (state.feedback === "未处理" && feedback) return false;
      if (state.feedback === "已赞" && (!feedback || feedback.action !== "like")) return false;
      if (state.feedback === "已Pass" && (!feedback || feedback.action !== "pass")) return false;
      if (state.q && !textFor(item).includes(state.q.toLowerCase())) return false;
      return true;
    }

    function chip(label, active, onClick) {
      const el = document.createElement("button");
      el.type = "button";
      el.className = `chip${active ? " active" : ""}`;
      el.textContent = label;
      el.addEventListener("click", onClick);
      return el;
    }

    function renderMetrics() {
      const daily = groupsDaily()[0];
      const weekly = activeWeekly();
      const metrics = [
        [daily ? daily.actual_count : 0, "今日新增"],
        [weekly ? weekly.actual_count : 0, "本周推荐"],
        [payload.stats.total_items || 0, "审核通过池"],
        [payload.stats.by_image_state && payload.stats.by_image_state["已对齐"] || 0, "已带图内容"]
      ];
      $("metrics").innerHTML = metrics.map(([value, label]) => `<div class="metric"><strong>${value}</strong><span>${label}</span></div>`).join("");
      $("generatedAt").textContent = `最近生成 ${String(payload.generated_at || "").replace("T", " ")}`;
    }

    function currentItems() {
      if (state.tab === "daily") {
        const group = activeDaily();
        return group ? group.items : [];
      }
      if (state.tab === "weekly") {
        const group = activeWeekly();
        return group ? group.recommendations : [];
      }
      return payload.items || [];
    }

    function currentTitle() {
      if (state.tab === "daily") {
        const group = activeDaily();
        if (!group) return "今日新增";
        const latest = groupsDaily()[0];
        return group.date === (latest && latest.date)
          ? `${group.date} 今日新增`
          : `${group.date} 历史情报`;
      }
      if (state.tab === "weekly") {
        const group = activeWeekly();
        return group ? `${group.week} 本周推荐` : "本周推荐";
      }
      return "审核通过池";
    }

    function currentNote() {
      if (state.tab === "daily") {
        const group = activeDaily();
        if (!group) return "工作日自动收集后，这里会按日期显示当天前 40 条去重情报。";
        const source = Object.entries(group.stats.by_source_family || {}).map(([k, v]) => `${k} ${v}`).join(" / ");
        const backfill = Number((group.stats || {}).backfill_count || 0);
        return `${group.actual_count} 条 · 每日分组 · 已去重${backfill ? ` · 历史补录 ${backfill}` : ""}${source ? " · " + source : ""}`;
      }
      if (state.tab === "weekly") {
        const group = activeWeekly();
        if (!group) return "每周自动生成 100 条推荐，并按买样、改造、方向参考分流。";
        const lane = Object.entries(group.stats.by_lane || {}).map(([k, v]) => `${k} ${v}`).join(" / ");
        return `${group.date_label || ""} · ${group.actual_count} 条 · 已去重${lane ? " · " + lane : ""}`;
      }
      return "这里只展示通过品类相关性、基础质量和创意增量审核的线索；未通过内容保留在审核归档中。";
    }

    function renderGroupSelector() {
      const root = $("groupSelector");
      root.innerHTML = "";
      if (state.tab === "daily") {
        const groups = groupsDaily();
        const active = activeDaily();
        const activeId = active && (active.group_id || active.date);
        groups.slice(0, 14).forEach(group => {
          const id = group.group_id || group.date;
          root.appendChild(chip(`${group.date} · ${group.actual_count}`, id === activeId, () => {
            state.dailyGroup = id;
            render();
          }));
        });
        const olderGroups = groups.slice(14);
        if (olderGroups.length) {
          const select = document.createElement("select");
          select.className = "history-select";
          select.setAttribute("aria-label", "选择更早日期");
          const placeholder = document.createElement("option");
          placeholder.value = "";
          placeholder.textContent = `更早日期（${olderGroups.length}）`;
          placeholder.selected = !olderGroups.some(group => (group.group_id || group.date) === activeId);
          select.appendChild(placeholder);
          olderGroups.forEach(group => {
            const option = document.createElement("option");
            option.value = group.group_id || group.date;
            option.textContent = `${group.date} · ${group.actual_count} 条`;
            option.selected = option.value === activeId;
            select.appendChild(option);
          });
          select.addEventListener("change", () => {
            if (!select.value) return;
            state.dailyGroup = select.value;
            render();
          });
          root.appendChild(select);
          const range = document.createElement("span");
          range.className = "history-range";
          range.textContent = `历史保留至 ${groups[groups.length - 1].date}`;
          root.appendChild(range);
        }
      } else if (state.tab === "weekly") {
        groupsWeekly().slice(0, 12).forEach(group => {
          const id = group.group_id || group.week;
          root.appendChild(chip(`${group.week} · ${group.actual_count}`, id === (activeWeekly() && (activeWeekly().group_id || activeWeekly().week)), () => {
            state.weeklyGroup = id;
            render();
          }));
        });
      }
    }

    function renderFilters(items) {
      const root = $("filters");
      const itemCategories = new Set(items.map(item => item.category).filter(Boolean));
      const categories = [
        ...configuredCategories,
        ...[...itemCategories].filter(category => !configuredCategories.includes(category) && !retiredCategories.has(category))
      ];
      const sources = [...new Set(items.map(item => item.source_family).filter(Boolean))];
      root.innerHTML = "";
      root.appendChild(chip("全部品类", state.category === "全部", () => { state.category = "全部"; render(); }));
      categories.forEach(category => root.appendChild(chip(`${category}${itemCategories.has(category) ? "" : " 0"}`, state.category === category, () => { state.category = category; render(); })));
      root.appendChild(chip("全部来源", state.source === "全部", () => { state.source = "全部"; render(); }));
      sources.forEach(source => root.appendChild(chip(source, state.source === source, () => { state.source = source; render(); })));
    }

    function renderLaneSwitch() {
      const root = $("laneSwitch");
      root.innerHTML = "";
      if (state.tab !== "weekly") return;
      ["全部", "可直接买样", "适合改造", "方向参考"].forEach(lane => {
        root.appendChild(chip(lane, state.lane === lane, () => { state.lane = lane; render(); }));
      });
    }

    function renderReviewStrip(items) {
      const summary = FeedbackStore.summary(items);
      const filters = ["全部", "未处理", "已赞", "已Pass"];
      $("reviewStrip").innerHTML = `
        <div class="review-counts">
          已评 <strong>${summary.reviewed}/${items.length}</strong> · 赞 ${summary.like} · Pass ${summary.pass}
          ${summary.pending ? ` · 待同步 ${summary.pending}` : ""}
        </div>
        <div class="feedback-switch" role="group" aria-label="反馈状态">
          ${filters.map(label => `<button class="feedback-filter${state.feedback === label ? " active" : ""}" type="button" data-feedback-filter="${label}">${label}</button>`).join("")}
        </div>`;
    }

    function card(item) {
      const feedback = FeedbackStore.decision(feedbackProductId(item));
      const feedbackClass = feedback ? ` feedback-${feedback.action}` : "";
      const status = feedback && feedback.action === "like"
        ? "已赞：后续会提高相似创意方向的权重"
        : feedback && feedback.action === "pass"
          ? `已 Pass：${passReasons.find(row => row[0] === feedback.reason)?.[1] || "已降低相似方向权重"}`
          : "";
      const image = item.image
        ? `<img class="thumb" src="${item.image}" alt="" loading="lazy">`
        : `<div class="thumb">${item.category || "灵感"}<br>${sourceText(item)}<br>待补图</div>`;
      const title = item.url
        ? `<a href="${item.url}" target="_blank" rel="noopener">${item.title}</a>`
        : `${item.title}`;
      return `<article class="card${feedbackClass}" data-item-id="${feedbackProductId(item)}">
        ${image}
        <div class="body">
          <div class="meta">
            <span class="pill">${item.action_lane}</span>
            <span class="pill green">${item.category || "未分类"}</span>
            <span class="pill blue">${scoreText(item)}分</span>
            ${item.is_backfill ? `<span class="pill gray">历史补录</span>` : ""}
          </div>
          <h3>${title}</h3>
          <p class="summary">${item.summary || item.next_action || item.review_reason || ""}</p>
          <div class="tags">
            ${(item.axes || []).slice(0, 2).map(axis => `<span class="pill gray">${axis}</span>`).join("")}
            <span class="pill gray">${sourceText(item)}</span>
          </div>
          <div class="feedback-actions">
            <button class="feedback-action like${feedback && feedback.action === "like" ? " active" : ""}" type="button" data-feedback-action="like" title="赞：值得继续寻找类似创意">赞</button>
            <button class="feedback-action pass${feedback && feedback.action === "pass" ? " active" : ""}" type="button" data-feedback-action="pass" title="Pass：减少类似产品">Pass</button>
            <button class="feedback-undo" type="button" data-feedback-action="clear" title="撤销反馈" ${feedback ? "" : "hidden"}>↶</button>
            <div class="feedback-status${feedback ? ` ${feedback.action}` : ""}">${status}</div>
          </div>
        </div>
      </article>`;
    }

    function renderGrid() {
      const base = currentItems();
      const items = base.filter(matches);
      $("emptyState").hidden = items.length > 0;
      $("grid").innerHTML = items.map(card).join("");
      renderFilters(base);
      renderReviewStrip(base);
    }

    function render() {
      renderMetrics();
      renderGroupSelector();
      renderLaneSwitch();
      $("viewTitle").textContent = currentTitle();
      $("viewNote").textContent = currentNote();
      renderGrid();
      document.querySelectorAll(".tab").forEach(tab => tab.classList.toggle("active", tab.dataset.tab === state.tab));
    }

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        state.tab = tab.dataset.tab;
        state.lane = "全部";
        state.category = "全部";
        state.source = "全部";
        render();
      });
    });
    $("search").addEventListener("input", event => {
      state.q = event.target.value.trim();
      renderGrid();
    });
    $("reviewStrip").addEventListener("click", event => {
      const button = event.target.closest("[data-feedback-filter]");
      if (!button) return;
      state.feedback = button.dataset.feedbackFilter;
      renderGrid();
    });
    $("grid").addEventListener("click", event => {
      const button = event.target.closest("[data-feedback-action]");
      const card = event.target.closest("[data-item-id]");
      if (!button || !card) return;
      const item = currentItems().find(row => feedbackProductId(row) === card.dataset.itemId);
      if (!item) return;
      const action = button.dataset.feedbackAction;
      const existing = FeedbackStore.decision(feedbackProductId(item));
      const context = {
        tab: state.tab,
        daily_group: state.dailyGroup,
        weekly_group: state.weeklyGroup,
      };
      if (action === "like") {
        if (existing && existing.action === "like") {
          FeedbackStore.clear(feedbackProductId(item));
        } else {
          FeedbackStore.record(item, "like", "", context);
        }
      } else if (action === "pass") {
        pendingPassItemId = feedbackProductId(item);
        document.querySelectorAll('input[name="pass-reason"]').forEach(input => {
          input.checked = Boolean(existing && existing.action === "pass" && existing.reason === input.value);
        });
        $("reasonDialog").showModal();
      } else if (action === "clear") {
        FeedbackStore.clear(feedbackProductId(item));
      }
    });

    $("reasonOptions").innerHTML = passReasons.map(([value, label]) => `
      <label class="reason-option">
        <input type="radio" name="pass-reason" value="${value}">
        <span>${label}</span>
      </label>`).join("");
    $("reasonForm").addEventListener("submit", event => {
      if (!event.submitter || event.submitter.value !== "confirm") {
        pendingPassItemId = "";
        return;
      }
      const reason = document.querySelector('input[name="pass-reason"]:checked');
      if (!reason) {
        event.preventDefault();
        return;
      }
      const item = currentItems().find(row => feedbackProductId(row) === pendingPassItemId);
      if (item) {
        FeedbackStore.record(item, "pass", reason.value, {
          tab: state.tab,
          daily_group: state.dailyGroup,
          weekly_group: state.weeklyGroup,
        });
      }
      pendingPassItemId = "";
    });
    window.addEventListener("feedback:change", renderGrid);
    window.addEventListener("feedback:sync", renderGrid);

    render();
  </script>
</body>
</html>
